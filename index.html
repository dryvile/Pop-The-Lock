<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pop the Lock Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
:root {
--line: hsl(343, 80%, 54%);
--notch: hsl(48, 83%, 59%);
--fail: hsl(0, 64%, 61%);
}

@keyframes pop-a {
0% {
transform: scale(0);
}
100% {
transform: scale(1);
}
}

@keyframes pop-b {
0% {
transform: scale(0);
}
100% {
transform: scale(1);
}
}

.appear-a {
animation: pop-a 0.25s ease-out;
}

.appear-b {
animation: pop-b 0.25s ease-out !important;
}

@keyframes fail {
0% {
transform: rotate(0);
}
25% {
transform: rotate(-2deg);
}
50% {
transform: rotate(0);
}
75% {
transform: rotate(2deg);
}
100% {
transform: rotate(0);
}
}

@keyframes next {
0% {
transform: translateX(0);
}
25% {
transform: translateX(0);
}
49.8% {
opacity: 1;
}
49.9% {
opacity: 0;
transform: translateX(-100%);
}
50.1% {
opacity: 0;
transform: translateX(100%);
}
50.2% {
opacity: 1;
}
75% {
transform: translateX(0);
}
100% {
transform: translateX(0);
}
}

@keyframes unlock {
0% {
transform: translateX(-50%) translateY(0);
}
20% {
transform: translateX(-50%) translateY(12px);
}
100% {
transform: translateX(-50%) translateY(-64px);
}
}

html, body {
height: 100%;
width: 100%;
margin: 0;
padding: 0;
touch-action: manipulation;
}

body {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
font-family: 'Fredoka', 'Comfortaa', 'Varela Round', sans-serif;
transition: background-color 0.5s;
overflow: hidden;
}

* {
user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
}

body.fail {
background: var(--fail) !important;
}

#game-container.fail {
animation: fail 0.5s ease-in-out;
}

.next {
animation: next 2s ease-in-out;
}

.unlock {
animation: unlock 0.5s ease-in-out forwards;
}

#label {
position: fixed;
top: max(12px, 2vh);
left: max(12px, 2vw);
text-transform: uppercase;
font-size: min(38px, 5vh);
line-height: min(38px, 5vh);
font-weight: 700;
height: min(38px, 5vh);
color: rgba(255, 255, 255, 0.65);
letter-spacing: 1px;
z-index: 10;
display: flex;
align-items: center;
}

#timer-display {
position: fixed;
top: max(12px, 2vh);
left: 50%;
transform: translateX(-50%);
text-transform: uppercase;
font-size: min(38px, 5vh);
line-height: min(38px, 5vh);
font-weight: 700;
height: min(38px, 5vh);
color: rgba(255, 255, 255, 0.65);
letter-spacing: 1px;
z-index: 10;
display: none;
align-items: center;
}

#settings-btn {
position: fixed;
top: max(12px, 2vh);
right: max(12px, 2vw);
height: min(38px, 5vh);
width: min(38px, 5vh);
cursor: pointer;
z-index: 10;
display: flex;
align-items: center;
justify-content: center;
}

#settings-btn svg {
width: 100%;
height: 100%;
fill: rgba(255, 255, 255, 0.65);
}

#settings-modal {
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: transparent;
padding: 16px;
box-sizing: border-box;
z-index: 100;
align-items: center;
justify-content: center;
}

#settings-modal.active {
display: flex;
}

.modal-card {
background: #ffffff;
border-radius: 40px;
width: 100%;
height: 100%;
padding: 30px 24px;
box-sizing: border-box;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
}

.modal-card h2 {
margin: 0;
font-size: min(32px, 7vw);
font-weight: 700;
color: #1a1a1a;
text-transform: uppercase;
letter-spacing: 0.5px;
text-align: center;
}

.setting-btn-pill {
width: 100%;
max-width: 400px;
background: #e9e9e9;
border-radius: 28px;
padding: 14px 0;
text-align: center;
font-size: min(22px, 5vw);
font-weight: 700;
color: #333333;
cursor: pointer;
}

.level-select-row {
display: flex;
align-items: center;
justify-content: space-between;
width: 100%;
max-width: 400px;
}

.arrow-btn {
background: #e9e9e9;
border: none;
border-radius: 28px;
width: 32%;
height: min(54px, 12vw);
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
}

.arrow-btn svg {
width: 32px;
height: 32px;
fill: #4a4a4a;
}

#target-level-display {
font-size: min(28px, 6.5vw);
font-weight: 700;
color: #333333;
width: 36%;
text-align: center;
}

.close-btn {
width: 100%;
max-width: 300px;
background: #505050;
border-radius: 28px;
padding: 14px 0;
text-align: center;
font-size: min(22px, 5vw);
font-weight: 700;
color: #ffffff;
text-transform: uppercase;
cursor: pointer;
}

#game-container {
position: relative;
width: 288px;
height: 380px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-end;
transform: scale(min(1, min(80vw / 288, 80vh / 440)));
transform-origin: center center;
}

/* Responsive Adjustments for Landscape Mode */
@media (orientation: landscape) and (max-height: 550px) {
#label, #timer-display, #settings-btn {
top: max(8px, 1.5vh);
font-size: min(24px, 6vh);
line-height: min(24px, 6vh);
height: min(24px, 6vh);
}

#settings-btn {
width: min(24px, 6vh);
}

#game-container {
margin-top: 20px;
transform: scale(min(0.85, min(70vw / 288, 65vh / 440)));
}

.modal-card {
padding: 16px;
border-radius: 24px;
}

.setting-btn-pill, .close-btn {
padding: 8px 0;
font-size: min(16px, 4vh);
border-radius: 18px;
}

.arrow-btn {
height: min(38px, 8vh);
border-radius: 18px;
}
}

#shackle {
position: absolute;
top: -60px;
left: 50%;
transform: translateX(-50%);
height: 238px;
width: 188px;
margin: 0 auto -24px auto;
opacity: 0.6;
display: block;
overflow: visible;
z-index: 1;
}

#lock {
position: absolute;
bottom: 0;
left: 50%;
transform: translateX(-50%);
height: 192px;
width: 192px;
border: 48px solid;
border-radius: 50%;
line-height: 192px;
text-align: center;
font-size: 110px;
font-weight: 700;
color: rgba(255, 255, 255, 0.5);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 2;
box-sizing: content-box;
}

#lock-title {
font-size: 24px;
line-height: 1.2;
}

#lock-subtitle {
font-size: 16px;
line-height: 1.2;
margin-top: 4px;
}

.dial {
position: absolute;
bottom: 0;
left: 50%;
transform: translateX(-50%);
height: 288px;
width: 288px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
z-index: 3;
pointer-events: none;
}

#line {
margin: 2px auto;
height: 44px;
width: 12px;
border-radius: 6px;
background: var(--line);
}

#notch {
margin: 10px;
height: 28px;
width: 28px;
border-radius: 50%;
background: var(--notch);
}
</style>
</head>
<body>

<section id="label">
<div><span id="label-prefix">LEVEL</span>: <span id="level"></span></div>
</section>

<div id="timer-display"><div>TIME: <span id="time-val">30</span>S</div></div>

<div id="settings-btn">
<svg viewBox="0 0 24 24">
<rect x="2" y="4" width="20" height="3" rx="1.5" />
<rect x="2" y="10.5" width="20" height="3" rx="1.5" />
<rect x="2" y="17" width="20" height="3" rx="1.5" />
</svg>
</div>

<div id="settings-modal">
<div class="modal-card">
<h2>SETTINGS</h2>
<div id="mode-toggle-btn" class="setting-btn-pill">Mode: Classic</div>
<div id="sound-toggle-btn" class="setting-btn-pill">Sound: On</div>
<div id="vibration-toggle-btn" class="setting-btn-pill">Vibration: On</div>
<div class="level-select-row" id="level-select-container">
<div id="level-prev" class="arrow-btn">
<svg viewBox="0 0 24 24"><path d="M16 5.5l-9 6.5 9 6.5z" stroke="#4a4a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div id="target-level-display">1</div>
<div id="level-next" class="arrow-btn">
<svg viewBox="0 0 24 24"><path d="M8 5.5l9 6.5-9 6.5z" stroke="#4a4a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
</div>
<div id="close-settings-btn" class="close-btn">CLOSE</div>
</div>
</div>

<div id="game-container">
<svg id="shackle" viewBox="0 0 188 176">
<path d="M 24 152 V 92 A 70 70 0 0 1 164 92 V 152" fill="none" stroke="currentColor" stroke-width="48" stroke-linecap="round" />
</svg>

<div id="notch-dial" class="dial">
<div id="notch" class="appear-a"></div>
</div>
<div id="line-dial" class="dial">
<div id="line"></div>
</div>

<div id="lock"></div>
</div>

<script>
(() => {
'use strict';

// Audio Context Setup
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let soundEnabled = true;
let vibrationEnabled = true;

try {
const savedSound = window.localStorage.getItem("soundEnabled");
if (savedSound !== null) soundEnabled = savedSound === "true";
const savedVib = window.localStorage.getItem("vibrationEnabled");
if (savedVib !== null) vibrationEnabled = savedVib === "true";
} catch (e) {
console.warn("LocalStorage access failed:", e);
}

$("#sound-toggle-btn").text("Sound: " + (soundEnabled ? "On" : "Off"));
$("#vibration-toggle-btn").text("Vibration: " + (vibrationEnabled ? "On" : "Off"));

const isMobileOrTablet = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

if (!isMobileOrTablet) {
$("#vibration-toggle-btn").hide();
}

function initAudio() {
if (!audioCtx) {
audioCtx = new AudioContext();
} else if (audioCtx.state === 'suspended') {
audioCtx.resume();
}
}

function triggerHaptic() {
// Vibration removed for mobile
}

function playPopSound() {
triggerHaptic();
if (!soundEnabled) return;
initAudio();
if (!audioCtx) return;

// Warm, gentle pure sine drop
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();

osc.type = 'sine';
osc.frequency.setValueAtTime(440, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.12);

gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start();
osc.stop(audioCtx.currentTime + 0.12);
}

function playUnlockSound() {
triggerHaptic();
if (!soundEnabled) return;
initAudio();
if (!audioCtx) return;

// Lively yet calm rising synth drops (same sound style as playPopSound)
const notes = [
{ startFreq: 330, endFreq: 220 }, // E4 -> A3
{ startFreq: 440, endFreq: 293 }, // A4 -> D4
{ startFreq: 554, endFreq: 370 }, // C#5 -> F#4
{ startFreq: 659, endFreq: 440 }  // E5 -> A4
];

notes.forEach((note, index) => {
const startTime = audioCtx.currentTime + (index * 0.08);

const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();

osc.type = 'sine';
osc.frequency.setValueAtTime(note.startFreq, startTime);
osc.frequency.exponentialRampToValueAtTime(note.endFreq, startTime + 0.14);

gain.gain.setValueAtTime(0.14, startTime);
gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.14);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start(startTime);
osc.stop(startTime + 0.14);
});
}

function playFailSound() {
triggerHaptic();
if (!soundEnabled) return;
initAudio();
if (!audioCtx) return;

// Calm, gentle minor descending synth drop
const notes = [
{ startFreq: 311.13, endFreq: 155.56 }, // Eb4 -> Eb3
{ startFreq: 293.66, endFreq: 146.83 }  // D4 -> D3
];

notes.forEach((note, index) => {
const startTime = audioCtx.currentTime + (index * 0.12);

const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();

osc.type = 'sine';
osc.frequency.setValueAtTime(note.startFreq, startTime);
osc.frequency.exponentialRampToValueAtTime(note.endFreq, startTime + 0.22);

gain.gain.setValueAtTime(0.15, startTime);
gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.22);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start(startTime);
osc.stop(startTime + 0.22);
});
}

// config
const baseSpeed = 0.035; // Standard manageable rotational speed
const notchWidth = 0.18; // Slightly expanded hit window to match human reaction time

let level = 1;
let maxLevelReached = 1;
let targetSelectLevel = 1;
let count = 1;
let status = "start";
let linePosition = 0;
let notchPosition = 0;
let clockwise = true;
let isSettingsOpen = false;

// Game Modes: "classic", "endless", "timeattack"
let gameMode = "classic";
let endlessScore = 0;
let endlessBest = 0;
let timeAttackScore = 0;
let timeAttackBest = 0;
let timeRemaining = 30;
let timerInterval = null;

try {
const savedMode = window.localStorage.getItem("gameMode");
if (savedMode) gameMode = savedMode;
endlessBest = parseInt(window.localStorage.getItem("endlessBest"), 10) || 0;
timeAttackBest = parseInt(window.localStorage.getItem("timeAttackBest"), 10) || 0;
} catch(e) {}

const colors = {
green: {
body: "hsl(168, 75%, 42%)",
lock: "hsl(210, 61%, 18%)"
},
violet: {
body: "hsl(267, 35%, 39%)",
lock: "hsl(220, 86%, 11%)"
},
orange: {
body: "hsl(24, 62%, 53%)",
lock: "hsl(35, 20%, 12%)"
},
blue: {
body: "hsl(186, 85%, 37%)",
lock: "hsl(32, 67%, 8%)"
},
olive: {
body: "hsl(55, 16%, 41%)",
lock: "hsl(0, 0%, 0%)"
}
};

function getInstructionText() {
return isMobileOrTablet ? "Tap Screen" : "Press Space";
}

function setColor(color) {
$("body").css({ "background": colors[color].body });
$("#lock").css({ "border-color": colors[color].lock });
$("#shackle").css({ "color": colors[color].lock });
}

function updateModeUI() {
if (gameMode === "classic") {
$("#mode-toggle-btn").text("Mode: Classic");
$("#label-prefix").text("LEVEL");
$("#level-select-container").css("display", "flex");
$("#timer-display").css("display", "none");
$("#level").text(level);
} else if (gameMode === "endless") {
$("#mode-toggle-btn").text("Mode: Endless");
$("#label-prefix").text("BEST");
$("#level-select-container").hide();
$("#timer-display").css("display", "none");
$("#level").text(endlessBest);
} else if (gameMode === "timeattack") {
$("#mode-toggle-btn").text("Mode: Time Attack");
$("#label-prefix").text("BEST");
$("#level-select-container").hide();
$("#timer-display").css("display", "flex");
$("#time-val").text(timeRemaining);
$("#level").text(timeAttackBest);
}
}

function stopTimer() {
if (timerInterval) {
clearInterval(timerInterval);
timerInterval = null;
}
}

function startTimer() {
stopTimer();
timeRemaining = 30;
$("#time-val").text(timeRemaining);
timerInterval = setInterval(() => {
if (status === "move" && !isSettingsOpen) {
timeRemaining--;
$("#time-val").text(timeRemaining);
if (timeRemaining <= 0) {
stopTimer();
setStatus("fail");
}
}
}, 1000);
}

function newNotch() {
notchPosition = (((Math.random() * 0.65 * Math.PI) + 0.35 * Math.PI) * ((clockwise * 2) - 1)) + linePosition;
$("#notch-dial").css({
"transform": "translateX(-50%) rotate(" + notchPosition + "rad)"
});
$("#notch").show();
$("#notch").toggleClass("appear-b");
}

function setStatus(newStatus) {
status = newStatus;
switch (newStatus) {
case "start":
stopTimer();
if (gameMode === "classic") {
if (level < 10) setColor("green");
else if (level < 20) setColor("violet");
else if (level < 30) setColor("orange");
else if (level < 40) setColor("blue");
else setColor("olive");
count = level;
} else if (gameMode === "endless") {
setColor("violet");
endlessScore = 0;
count = 0;
} else if (gameMode === "timeattack") {
setColor("orange");
timeAttackScore = 0;
timeRemaining = 30;
$("#time-val").text(timeRemaining);
count = 0;
}

$("#lock").html('<div id="lock-title">Pop The Lock</div><div id="lock-subtitle">' + getInstructionText() + '</div>');
linePosition = 0;
clockwise = true;
newNotch();
$("body").removeClass("fail");
$("#game-container").removeClass("fail");
break;
case "move":
if (gameMode === "timeattack" && !timerInterval) {
startTimer();
}
break;
case "fail":
stopTimer();
playFailSound();
$("#notch").hide();
$("body").addClass("fail");
$("#game-container").addClass("fail");
break;
case "win":
stopTimer();
playUnlockSound();
$("#notch").hide();
$("body").addClass("next");
$("#shackle").addClass("unlock");
setTimeout(() => {
setLevel(level + 1);
setStatus("start");
$("#shackle").removeClass("unlock");
}, 1000);
setTimeout(() => {
$("body").removeClass("next");
}, 2000);
break;
}
}

function setCount(newCount) {
count = newCount;
$("#lock").text(count);
}

function setLevel(newLevel) {
level = newLevel;
if (level > maxLevelReached) {
maxLevelReached = level;
}
if (gameMode === "classic") {
$("#level").text(level);
}
try {
window.localStorage.setItem("level", level);
window.localStorage.setItem("maxLevel", maxLevelReached);
} catch (e) {
console.warn("LocalStorage is unavailable:", e);
}
}

function openSettings() {
isSettingsOpen = true;
targetSelectLevel = level;
$("#target-level-display").text(targetSelectLevel);
$("#settings-modal").addClass("active");
if (status === "move") {
setStatus("start");
}
}

function closeSettings() {
isSettingsOpen = false;
$("#settings-modal").removeClass("active");
if (targetSelectLevel !== level && gameMode === "classic") {
setLevel(targetSelectLevel);
setStatus("start");
}
}

$("#mode-toggle-btn").on("click touchstart", (e) => {
e.stopPropagation();
e.preventDefault();
if (gameMode === "classic") gameMode = "endless";
else if (gameMode === "endless") gameMode = "timeattack";
else gameMode = "classic";

try {
window.localStorage.setItem("gameMode", gameMode);
} catch (err) {}

updateModeUI();
setStatus("start");
});

$("#settings-btn").on("click touchstart", (e) => {
e.stopPropagation();
e.preventDefault();
openSettings();
});

$("#close-settings-btn").on("click touchstart", (e) => {
e.stopPropagation();
e.preventDefault();
closeSettings();
});

$("#sound-toggle-btn").on("click touchstart", (e) => {
e.stopPropagation();
e.preventDefault();
soundEnabled = !soundEnabled;
$("#sound-toggle-btn").text("Sound: " + (soundEnabled ? "On" : "Off"));
try {
window.localStorage.setItem("soundEnabled", soundEnabled);
} catch (err) {
console.warn("LocalStorage failed:", err);
}
});

$("#vibration-toggle-btn").on("click touchstart", (e) => {
e.stopPropagation();
e.preventDefault();
vibrationEnabled = !vibrationEnabled;
$("#vibration-toggle-btn").text("Vibration: " + (vibrationEnabled ? "On" : "Off"));
try {
window.localStorage.setItem("vibrationEnabled", vibrationEnabled);
} catch (err) {
console.warn("LocalStorage failed:", err);
}
});

$("#level-prev").on("click touchstart", (e) => {
e.stopPropagation();
e.preventDefault();
if (targetSelectLevel > 1) {
targetSelectLevel--;
$("#target-level-display").text(targetSelectLevel);
}
});

$("#level-next").on("click touchstart", (e) => {
e.stopPropagation();
e.preventDefault();
if (targetSelectLevel < maxLevelReached) {
targetSelectLevel++;
$("#target-level-display").text(targetSelectLevel);
}
});

function click(event) {
if (isSettingsOpen) {
return;
}

if (event && !event.isTrusted) {
return;
}

if (event && event.type === "keydown" && event.code !== "Space") {
return;
}
if (event && event.type === "keydown" && event.code === "Space") {
event.preventDefault();
}

switch (status) {
case "start":
setStatus("move");
if (gameMode === "classic") {
setCount(count);
} else {
setCount(0);
}
break;
case "move":
if (Math.abs(Math.atan2(Math.sin(linePosition - notchPosition), Math.cos(linePosition - notchPosition))) < notchWidth) {
playPopSound();

if (gameMode === "classic") {
setCount(count - 1);
if (count === 0) {
setStatus("win");
} else {
clockwise = !clockwise;
newNotch();
}
} else if (gameMode === "endless") {
endlessScore++;
setCount(endlessScore);
if (endlessScore > endlessBest) {
endlessBest = endlessScore;
$("#level").text(endlessBest);
try { window.localStorage.setItem("endlessBest", endlessBest); } catch(e){}
}
clockwise = !clockwise;
newNotch();
} else if (gameMode === "timeattack") {
timeAttackScore++;
timeRemaining += 1;
$("#time-val").text(timeRemaining);
setCount(timeAttackScore);
if (timeAttackScore > timeAttackBest) {
timeAttackBest = timeAttackScore;
$("#level").text(timeAttackBest);
try { window.localStorage.setItem("timeAttackBest", timeAttackBest); } catch(e){}
}
clockwise = !clockwise;
newNotch();
}
} else {
setStatus("fail");
}
break;
case "fail":
setStatus("start");
break;
case "win":
setStatus("start");
break;
}
}

function step() {
if (status === "move" && !isSettingsOpen) {
let speedMultiplier = gameMode === "classic" ? level : (gameMode === "endless" ? endlessScore : timeAttackScore);
let currentSpeed = baseSpeed + Math.min(0.015, (speedMultiplier / 1000) * 0.01);
linePosition += currentSpeed * (clockwise * 2 - 1);
$("#line-dial").css({
"transform": "translateX(-50%) rotate(" + linePosition + "rad)"
});
if ((Math.atan2(Math.sin(linePosition - notchPosition), Math.cos(linePosition - notchPosition))) * (clockwise * 2 - 1) > notchWidth) {
setStatus("fail");
}
}
window.requestAnimationFrame(step);
}

window.requestAnimationFrame(step);
window.addEventListener("mousedown", click);
window.addEventListener("touchstart", (event) => {
if (event.isTrusted && !isSettingsOpen && !$(event.target).closest("#settings-btn, #settings-modal").length) {
event.preventDefault();
click(event);
}
}, { passive: false });
window.addEventListener("keydown", (event) => {
if (!event.isTrusted) return;
if (status === "start" && event.code === "Space") {
$("#lock-subtitle").text("Press Space");
}
click(event);
});

let savedLevel = 1;
try {
savedLevel = parseInt(window.localStorage.getItem("level"), 10) || 1;
maxLevelReached = parseInt(window.localStorage.getItem("maxLevel"), 10) || savedLevel;
} catch (e) {
console.warn("LocalStorage access failed:", e);
}
setLevel(savedLevel);
updateModeUI();
setStatus("start");
})();
</script>
</body>
</html>
